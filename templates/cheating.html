<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cheating Detected</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo/Lsentra2.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- Load ES modules -->
  <script type="module" src="{{ url_for('static', filename='socket.js') }}" defer></script>
  <script type="module" src="{{ url_for('static', filename='notifications.js') }}" defer></script>
  <script type="module" src="{{ url_for('static', filename='cheating.js') }}" defer></script><!-- connect to js -->
</head>
<body>
  <div class="cheating-message">
    <h1>Possible Cheating Detected!</h1>
    <p id="snapshot-timestamp">
      {% if timestamp %}Snapshot at: {{ timestamp }}{% endif %}
    </p>

    <!-- Snapshot -->
    <img id="cheating-snapshot-img"
         src="{{ url_for('cheating_snapshot', snap_id=snapshot_id) }}"
         alt="Cheating Snapshot"
         class="snapshot-img">

    <!-- Timeline -->
    <div class="timeline-container">
      <div class="timeline" id="timeline">
        {% for snap in cheating_snapshots %}
          <div class="timeline-point 
                      {% if snap.id == snapshot_id %}active{% endif %}" 
               title="Taken at {{ snap.timestamp }}"
               data-id="{{ snap.id }}"
               data-timestamp="{{ snap.timestamp }}"
               data-epoch="{{ snap.epoch }}">
          </div>
        {% endfor %}
      </div>

      <!-- Labels -->
      <div class="timeline-labels" id="timeline-labels">
        {% if cheating_snapshots %}
          <span id="timeline-start">{{ cheating_snapshots[0].timestamp }}</span>
          <span id="timeline-end">{{ cheating_snapshots[-1].timestamp }}</span>
        {% endif %}
      </div>
    </div>
  </div>

  <!-- Add this script block at the end of <body> in cheating.html -->
  <script>
  document.addEventListener("DOMContentLoaded", function() {
    const img = document.getElementById("cheating-snapshot-img");
    if (!img) return;
    // Fetch the snapshot endpoint which returns base64 or data-url text
    fetch(img.src)
      .then(response => response.text())
      .then(data => {
        if (!data) return;
        // If server already returns a data URI use it, otherwise prefix as JPEG base64
        img.src = data.startsWith("data:") ? data : ("data:image/jpeg;base64," + data);
      })
      .catch(err => console.warn("Failed to fetch initial snapshot:", err));
  });
  </script>
</body>
</html>
