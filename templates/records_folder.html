<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Records for {{ folder_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="records-main">
    <div class="records-header">
      <div class="header-content">
        <a href="{{ url_for('records') }}" class="back-link">← Back to folders</a>
        <h2>Snapshots for {{ folder_name }}</h2>
      </div>
    </div>

    {% if snapshots %}
    <div class="records-grid">
      {% for s in snapshots %}
      <div class="snapshot-card">
        <a href="{{ url_for('cheating', snap_id=s.id) }}" class="snapshot-link">
          <img data-src="{{ s.image_url }}" alt="snapshot" class="record-thumb">
        </a>
        <div class="snapshot-info">
          <div class="timestamp">{{ s.timestamp }}</div>
          <form method="POST" action="{{ url_for('delete_snapshot', snap_id=s.id) }}" class="delete-form">
            <button type="button" class="delete-btn">Delete</button>
          </form>
        </div>
      </div>
      {% endfor %}
    </div>
    {% else %}
      <div class="no-records">
        <div class="no-records-icon">🖼️</div>
        <p>No snapshots for this folder.</p>
        <small>Run detection to capture snapshots.</small>
      </div>
    {% endif %}
  </main>

<div id="deleteModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <p>Are you sure you want to delete this snapshot?</p>
    <button id="confirmDelete">Delete</button>
    <button class="cancel">Cancel</button>
  </div>
</div>

<script src="{{ url_for('static', filename='records.js') }}"></script>
</body>
</html>
