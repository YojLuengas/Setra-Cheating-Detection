<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Records for {{ day }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main style="padding:28px; max-width:1100px; margin:0 auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
      <div>
        <a href="{{ url_for('records') }}" style="color:#0b3d91; text-decoration:none;">← Back to folders</a>
        <h2 style="margin:6px 0 0 0;">Snapshots for {{ day }}</h2>
      </div>
    </div>

    {% if snapshots %}
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:16px;">
      {% for s in snapshots %}
      <div class="snapshot-card" style="background:#fff; padding:12px; border-radius:10px; box-shadow:0 6px 18px rgba(16,42,67,0.06);">
        <a href="{{ url_for('cheating', snap_id=s.id) }}" style="text-decoration:none; color:inherit;">
          <img data-src="{{ s.image_url }}" alt="snapshot" class="record-thumb" style="width:100%; height:140px; object-fit:cover; border-radius:8px; background:#f3f6fb;">
        </a>
        <div style="margin-top:8px; font-size:13px; color:#6b7280;">{{ s.timestamp }}</div>
      </div>
      {% endfor %}
    </div>
    {% else %}
      <p>No snapshots for this date.</p>
    {% endif %}
  </main>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // load base64/data urls for thumbnails
  document.querySelectorAll(".record-thumb").forEach(function(img) {
    const src = img.getAttribute("data-src");
    if (!src) return;
    // fetch text because cheating_snapshot returns a data URI string
    fetch(src)
      .then(r => r.text())
      .then(t => {
        if (!t) return;
        img.src = t.startsWith("data:") ? t : ("data:image/jpeg;base64," + t);
      })
      .catch(() => {
        // fallback: use the endpoint URL directly (some setups return binary)
        img.src = src;
      });
  });
});
</script>
</body>
</html>
