<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheating Detection</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> <!-- for icons -->
</head>
<body>

  <div class="container">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <ul class="menu-top">
        <li id="alerts-menu">
          <i class="fa-regular fa-bell"></i>
          <span>Alerts</span>
          <span id="alert-badge" class="badge">0</span>
        </li>
        <li><i class="fa-regular fa-clock"></i><span>Records</span></li>
        <li><i class="fa-regular fa-user"></i><span>Users</span></li>
      </ul>
      <ul class="menu-bottom">
        <li><i class="fa-solid fa-gear gear-icon"></i><span>Settings</span></li>
      </ul>
    </aside>

    <!-- Notification Panel -->
    <nav class="notifPanel">
      <h2>Notifications</h2>
      <div id="notifications">
        <p id="no-alerts-msg">No alerts yet</p>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <div class="camera-container">
        <div class="video-wrapper">
          <img id="video-frame" alt="AI Detection Feed">
        </div>
        <div id="cheating-status" class="status-text">
          No cheating detected
        </div>
        <div class="controls">
          <button id="start-btn">Start Camera</button>
          <button id="stop-btn">Stop Camera</button>
          <br>
          <select id="camera-select" class="camera-select"></select>
        </div>
      </div>
    </main>
  </div>

  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- Entry point (modular JS) -->
  <script type="module" src="{{ url_for('static', filename='main.js') }}" defer></script>
</body>
</html>
