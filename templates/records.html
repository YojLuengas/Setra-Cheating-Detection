<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Detection Records</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h2>Cheating Detection Records</h2>

<table class="records-table">
  <tr>
    <th>Snapshot</th>
    <th>Timestamp</th>
  </tr>
  {% for det in detections %}
  <tr>
    <td>
      <img class="record-snapshot" src="{{ det.image_url }}" alt="Snapshot" width="120" />
    </td>
    <td>{{ det.timestamp }}</td>
  </tr>
  {% endfor %}
</table>
<script>
document.addEventListener("DOMContentLoaded", function() {
  document.querySelectorAll(".record-snapshot").forEach(function(img) {
    fetch(img.src)
      .then(response => response.text())
      .then(dataUrl => {
        img.src = dataUrl;
      });
  });
});
</script>
</body>
</html>
