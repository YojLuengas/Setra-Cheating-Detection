<div class="records-header">
  <div class="header-content">
    <h2>{{ header_title }}</h2>
  </div>

  <div class="header-actions">
    <div class="sort-dropdown">
      <button class="sort-btn">
        <span class="material-symbols-outlined">sort</span>
        Sort
      </button>
      <div class="sort-menu">
        <span class="sort-option" data-sort="name">Name (A–Z)</span>
        <span class="sort-option" data-sort="date">Date Created</span>
        <span class="sort-option" data-sort="count">Snapshot Count</span>
      </div>
    </div>

    <div class="header-menu-container">
      <button class="header-menu-btn">
        <span class="material-symbols-outlined">more_horiz</span>
      </button>
      <div class="header-menu-dropdown">
        <a href="#" class="header-menu-item">Open</a>
        <span class="header-menu-item select-mode-btn">Select</span>
        <span class="header-menu-item select-mode-btn">Select All</span>
        <span class="header-menu-item folder-delete-btn">Delete</span>
      </div>
    </div>

    <input type="text" id="{{ search_input_id }}" placeholder="{{ search_placeholder }}" class="search-bar">
  </div>
</div>
