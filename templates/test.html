<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cheating Detection</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div class="container">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <ul class="menu-top">
        <li id="alerts-menu">
          <i class="fa-regular fa-bell"></i>
          <span>Alerts</span>
          <span id="alert-badge" class="badge">0</span>
        </li>
        <li><i class="fa-regular fa-clock"></i><span>Records</span></li>
        <li><i class="fa-regular fa-user"></i><span>Users</span></li>
      </ul>

      <ul class="menu-bottom">
        <li>
          {% if session.username %}
          <form action="{{ url_for('logout') }}" method="GET" style="display:inline;">
            <button type="submit" class="logout-btn">
              <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
          </form>
          {% endif %}
        </li>
      </ul>
    </aside>

    <!-- Notification Panel -->
    <nav class="notifPanel">
      <h2>Notifications</h2>
      <div id="notifications">
        <p id="no-alerts-msg">No alerts yet</p>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Exam Setup Screen -->
      <div id="exam-setup" class="setup-screen">
        <div class="setup-card">
          <h2>Exam Session Setup</h2>

          <div class="setup-tabs">
            <button class="tab active">Basic Info</button>
            <button class="tab" disabled>System Check</button>
            <button class="tab" disabled>Confirm</button>
          </div>

          <form id="setup-form" class="setup-form">
            <div class="form-row">
              <div class="form-group">
                <label>Course & Section</label>
                <input type="text" id="course" required>
              </div>
              <div class="form-group">
                <label>Subject</label>
                <input type="text" id="subject" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Assessment Type</label>
                <select id="exam-type" required>
                  <option value="" disabled selected>Select Exam Type</option>
                  <option value="midterm">Prelim Exam</option>
                  <option value="midterm">Midterm Exam</option>
                  <option value="midterm">Prefinal Exam</option>
                  <option value="final">Final Exam</option>
                  <option value="quiz">Quiz</option>
                  <option value="other">Other</option>
                </select>
              </div>

              <div class="form-group">
                <label>Date & Time</label>
                <input type="datetime-local" id="exam-datetime" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Select Camera</label>
                <select id="camera-select" class="camera-select"></select>
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="cancel-btn">Cancel</button>
              <button type="button" id="exam-next-btn" class="next-btn">Next</button> 
           </div>
          </form>
        </div>
      </div>

      <div id="system-check" class="setup-screen" style="display:none;">
        <div class="setup-card">
          <h2>System & Camera Check</h2>

          <div class="setup-tabs">
            <button class="tab completed">Basic Info</button>
            <button class="tab active">System Check</button>
            <button class="tab" disabled>Confirm</button>
          </div>

          <div class="camera-status-container">
            <!-- Status indicators aligned horizontally -->
            <div class="status-item">
            <!-- Modern Wi-Fi icon -->
            <span class="status-label">Internet Connectivity</span>
            <i id="internet-status" class="fa-solid fa-wifi offline"></i>
          </div>

          <!-- Camera Preview below the status row -->
          <div class="camera-preview-container">
            <label>Camera Preview</label>
            <div class="camera-video-wrapper">
              <video id="camera-preview" autoplay muted></video>
              <!-- Camera status dot overlay -->
              <div id="camera-status" class="status-indicator offline"></div>
            </div>
          </div>

          <!-- Proceed / Back buttons -->
          <div class="form-actions">
            <button type="button" class="cancel-btn">Back</button>
            <button type="button" id="system-check-next" class="next-btn">Proceed</button>
          </div>
        </div>
      </div>

      <!-- Confirm Screen -->
<div id="confirm-screen" class="setup-screen" style="display:none;">
  <div class="setup-card">
    <h2>Confirm Exam Setup</h2>

    <div class="setup-tabs">
      <button class="tab completed">Basic Info</button>
      <button class="tab completed">System Check</button>
      <button class="tab active">Confirm</button>
    </div>

    <div class="confirmation-details">
      <p><strong>Course & Section:</strong> <span id="confirm-course"></span></p>
      <p><strong>Subject:</strong> <span id="confirm-subject"></span></p>
      <p><strong>Exam Type:</strong> <span id="confirm-exam-type"></span></p>
      <p><strong>Date & Time:</strong> <span id="confirm-datetime"></span></p>
      <p><strong>Camera:</strong> <span id="confirm-camera"></span></p>
    </div>

    <div class="form-actions">
      <button type="button" id="confirm-back" class="cancel-btn">Back</button>
      <button type="button" id="confirm-submit" class="next-btn">Confirm</button>
    </div>
  </div>
</div>


      <div class="camera-container" style="display:none;">
          <div class="video-wrapper">
            <img id="video-frame" src="" alt="AI Detection Feed will appear here">
          </div>
          <div id="cheating-status" class="status-text">
            No cheating detected
          </div>
          <div class="controls">
            <button id="start-btn">Start Camera</button>
            <button id="stop-btn">Stop Camera</button>
            <br>
          </div>
      </div>
    </main>
  </div>

  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script type="module" src="{{ url_for('static', filename='main.js') }}" defer></script>
  <script>
  const examSetup = document.getElementById("exam-setup");
const systemCheck = document.getElementById("system-check");
const confirmScreen = document.getElementById("confirm-screen");
const examNextBtn = document.getElementById("exam-next-btn");

// Go to System Check
examNextBtn.addEventListener("click", () => {
  examSetup.style.display = "none";
  systemCheck.style.display = "flex";

  startCameraPreview();
  checkInternetConnectivity();
});

// Back -> Exam Setup
document.querySelector("#system-check .cancel-btn").addEventListener("click", () => {
  systemCheck.style.display = "none";
  examSetup.style.display = "flex";
});

// Proceed -> Confirm
document.getElementById("system-check-next").addEventListener("click", () => {
  systemCheck.style.display = "none";
  confirmScreen.style.display = "flex";

  // Fill confirm details
  document.getElementById("confirm-course").textContent = document.getElementById("course").value;
  document.getElementById("confirm-subject").textContent = document.getElementById("subject").value;
  document.getElementById("confirm-exam-type").textContent = document.getElementById("exam-type").value;
  document.getElementById("confirm-datetime").textContent = document.getElementById("exam-datetime").value;
  document.getElementById("confirm-camera").textContent = document.getElementById("camera-select").value;
});

// Back -> System Check from Confirm
document.getElementById("confirm-back").addEventListener("click", () => {
  confirmScreen.style.display = "none";
  systemCheck.style.display = "flex";
});

// Final Confirm -> Go to camera container
document.getElementById("confirm-submit").addEventListener("click", () => {
  confirmScreen.style.display = "none";
  document.querySelector(".camera-container").style.display = "flex";
});

// Camera preview function
function startCameraPreview() {
  const video = document.getElementById("camera-preview");
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
      video.srcObject = stream;
      const status = document.getElementById("camera-status");
      status.classList.remove("offline");
      status.classList.add("online");
    })
    .catch(() => {
      const status = document.getElementById("camera-status");
      status.classList.remove("online");
      status.classList.add("offline");
    });
}

// Internet connectivity check
function checkInternetConnectivity() {
  const statusEl = document.getElementById("internet-status");

  async function updateStatus() {
    try {
      await fetch("https://www.google.com", { mode: "no-cors" });
      statusEl.classList.remove("offline");
      statusEl.classList.add("online");
    } catch {
      statusEl.classList.remove("online");
      statusEl.classList.add("offline");
    }
  }

  updateStatus();
  setInterval(updateStatus, 5000);

  statusEl.addEventListener("click", updateStatus);
}

</script>
</body>
</html>

<style>
    /* Setup Screen Overlay */
.setup-screen {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100%;
}

.setup-card {
  background: #fff;
  border-radius: 12px;
  padding: 24px 32px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  max-width: 1000px;
  width: 8in;
}

.setup-card h2 {
  margin-bottom: 16px;
  font-size: 22px;
  font-weight: 600;
  color: #333;
}

/* Tabs */
.setup-tabs {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  justify-content: center;
}

.setup-tabs .tab {
  padding: 8px 16px;
  border: none;
  border-bottom: 3px solid transparent;
  background: none;
  font-weight: 500;
  cursor: pointer;
  color: #666;
}

.setup-tabs .tab.active {
  border-color: #007bff;
  color: #007bff;
}

.setup-tabs .tab:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Form Layout */
.setup-form {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.form-row {
  display: flex;
  gap: 16px;
}

.form-group {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.form-group label {
  font-size: 14px;
  margin-bottom: 6px;
  font-weight: 500;
  color: #444;
}

.form-group input,
.form-group select {
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}

/* Camera Dropdown */
.camera-select {
  padding: 10px 20px;
  margin: 5px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
  width: 340px; /* auto but matches button width */
  min-width: 160px; /* keep same width as buttons */
  text-align: center;
}

/* Actions */
.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 10px;
}

.cancel-btn,
.next-btn {
  padding: 10px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
}

.cancel-btn {
  background: #f5f5f5;
  color: #333;
}

.next-btn {
  background: #007bff;
  color: #fff;
}

.status-item {
  display: flex;
  align-items: center;
  gap: 8px; /* spacing between icon and text */
}

#internet-status {
  font-size: 20px;
  color: gray; /* offline */
  transition: color 0.3s;
}

/* Online/offline states */
#internet-status.online {
  color: #28a745; /* green */
}

#internet-status.offline {
  color: #dc3545; /* red */
}

.camera-status-container {
  display: flex;
  flex-direction: column;
  align-items: flex-start; /* align all items to the left */
  gap: 16px;
  width: 100%;
  max-width: 650px;
}

.status-row {
  display: flex;
  justify-content: flex-start; /* align items to the left */
  gap: 40px; /* space between internet and camera status */
  width: 100%;
}


/* Each status item layout */
.status-item {
  display: flex;
  align-items: center; /* vertical center */
  gap: 8px; /* space between dot and label */
  flex: unset; /* remove stretching */
}

/* Camera preview container */
.camera-preview-container {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: flex-start; /* align video to left */
}

/* Camera preview video */
#camera-preview {
  border: 1px solid #ccc;
  border-radius: 6px;
  width: 100%;
  max-width: 800px;
  height: 400px;
  object-fit: cover;
}

/* Video wrapper to allow overlaying status */
.camera-video-wrapper {
  position: relative;
  width: 100%;
  max-width: 800px;
}

/* Position camera status dot on top-right corner of video */
#camera-status {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 16px;
  height: 16px;
  border: 2px solid #8e9a90;
  border-radius: 50%;
  transition: background-color 0.3s;
  z-index: 2;
}

/* Online/offline colors */
#camera-status.online {
  background-color: #28a745; /* green */
}

#camera-status.offline {
  background-color: #dc3545; /* red */
}

</style>
